[build]
# Strip build-machine paths from panic messages and debug info.
# The leading slash ensures the substitution matches the absolute path prefix
# added by rustc; the replacement is an empty string so no path leaks.
rustflags = [
    "--remap-path-prefix", "/home=/",
    "--remap-path-prefix", "/root=/",
    "--remap-path-prefix", "/Users=/",
    "--remap-path-prefix", "/var=/",
    "--remap-path-prefix", "/tmp=/",
]

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
rustflags = ["-C", "link-args=-static-libgcc"]

[target.x86_64-unknown-linux-musl]
linker = "musl-gcc"
